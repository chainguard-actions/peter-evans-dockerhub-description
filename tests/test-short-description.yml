name: Test short description input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a README for testing
        run: |
          echo "# Test Repository" > README.md
          echo "This is a test README for Docker Hub description." >> README.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          password: test-password-invalid
          repository: test-user/test-repo
          short-description: "A short description for the Docker Hub repository"

      - name: Assert action ran and failed gracefully (invalid credentials, short-description accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
