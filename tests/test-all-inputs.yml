name: Test all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test README
        run: |
          echo "# Test README" > /tmp/test-readme.md
          echo "This is a test description." >> /tmp/test-readme.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          password: test-password
          repository: test-user/test-repo
          short-description: "A test repository description"
          readme-filepath: /tmp/test-readme.md
          enable-url-completion: "true"
          image-extensions: "bmp,gif,jpg,jpeg,png,svg,webp"
      - name: Assert action ran (credentials expected to fail)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail due to invalid credentials in test environment
          # We only verify that all inputs were accepted and the action ran
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all inputs provided"
