name: Test custom readme filepath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom README file
        run: |
          mkdir -p docs
          echo "# Custom README" > docs/DOCKER_README.md
          echo "This is a custom Docker Hub description." >> docs/DOCKER_README.md
          echo "It has multiple lines of content." >> docs/DOCKER_README.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          password: test-password-invalid
          repository: test-user/test-repo
          readme-filepath: ./docs/DOCKER_README.md

      - name: Assert action ran and failed gracefully (invalid credentials, custom readme path accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
